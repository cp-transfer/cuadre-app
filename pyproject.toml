[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cuadre-app"
version = "1.0.0"
description = "CP Company store cash reconciliation application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6==6.12.0",
    "reportlab==5.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
]

[project.scripts]
cuadre = "cuadre.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
